name: medigemma_field
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.11.5

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # google_generative_ai: ^0.4.6  # Gemma 系の generateContent 未対応のため http で直接叩く
  connectivity_plus: ^6.1.4
  image_picker: ^1.1.2
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  flutter_dotenv: ^5.2.1
  shared_preferences: ^2.3.0
  flutter_gemma: ^0.15.0  # 0.15.0: LiteRT-LM 0.11.0 + MTP/speculative decoding (~1.5-2x 高速化)
  # ★ background_downloader を direct dep に昇格 (元々 flutter_gemma 経由で transitive)
  #   FileDownloader.configureNotification() を直接呼んで foreground service の
  #   通知設定を登録するために必要。SmartDownloader は runInForeground を設定するが
  #   通知設定がないと Android 13+ で foreground service が起動できない (deprecated
  #   important-while-foreground flag のみで、通知 channel + notification が無いと
  #   ForegroundService に昇格できず通常 job に降格 → 裏化時に kill される)。
  background_downloader: ^9.5.4
  path_provider: ^2.1.0
  http: ^1.2.0
  wakelock_plus: ^1.2.10  # DL 中に Android が裏化で WorkManager job kill する問題対策
  # flutter_local_notifications: ^18.0.1  # 一旦無効化・plugin loader 問題
  # ★ permission_handler 撤去 (2026-05-11)
  #   POST_NOTIFICATIONS runtime 許可は MainActivity.kt で直接ネイティブ実装。
  #   Windows-Gradle 環境で permission_handler の kernel_snapshot 依存解決
  #   問題が再現したため、パッケージを使わず Activity の onCreate で
  #   ActivityCompat.requestPermissions() を呼ぶ方式に切替。
  # ★ セキュリティメモ: at-rest 暗号化は Android File-Based Encryption (FBE)
  #   に委譲。Android 7+ で app-private storage は hardware-backed key で
  #   自動暗号化される。flutter_secure_storage の追加は当初検討したが、
  #   wakelock_plus との依存衝突で kernel_snapshot がビルドエラーを起こす
  #   環境問題が発生したため不採用。OWASP Principle #2 は OS-level FBE で達成。

dev_dependencies:
  flutter_test:
    sdk: flutter
  # ★ integration_test: 実機 (Pixel 6a) シナリオの自動化用
  #   実行: flutter test integration_test/app_test.dart -d <device-id>
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
  flutter_lints: ^6.0.0

# ─── アプリアイコン (Android Launcher) ─────────────────────
# 実行: flutter pub run flutter_launcher_icons
# Android 8+ では adaptive_icon (foreground + background) が使われる
# 旧 Android では image_path の単一画像が使われる
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  # ★ アダプティブアイコンは foreground (透明 PNG) + background (色) の合成。
  #   旧設定では fg = app_icon_fg.png (透明背景の手アイコン) → ランチャー表示で
  #   「透明 PNG が見える」UX 不具合 (Pixel ランチャーは fg を中央に小さく表示するため)。
  #   修正: fg にも cream 背景込みの app_icon.png を使い、bg と blend させる。
  adaptive_icon_background: "#FFFBF0"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  adaptive_icon_foreground_inset: 16   # 円マスク時の安全マージン (px)
  min_sdk_android: 21
  remove_alpha_ios: true

# ─── 起動スプラッシュ画面 ─────────────────────────────────
# 実行: dart run flutter_native_splash:create
# 1080x2400 の splash.png を Android スプラッシュ画面として表示
flutter_native_splash:
  color: "#FFFBF0"          # cream — splash.png の背景と整合
  image: assets/splash/splash.png
  android_12:
    # Android 12+ (Pixel 6a 含む) は中央の icon のみ表示 (full image 不可)。
    # 透過 PNG を直接使うと「icon が消えて見える」現象があるため、
    # cream 背景込みの app_icon.png を使い、splash 背景色と blend。
    image: assets/icon/app_icon.png
    color: "#FFFBF0"
    icon_background_color: "#FFFBF0"
  android: true
  ios: false
  web: false

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # ⚠️ .env は asset として bundle しない (real secrets が APK に入る重大な
  #    セキュリティ問題)。.env は開発時のみ runtime で読まれ、本番では
  #    存在しなくても問題ない (main.dart で try/catch・HF_TOKEN は任意)。
  assets:
    - assets/images/
    - assets/icd11/

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
